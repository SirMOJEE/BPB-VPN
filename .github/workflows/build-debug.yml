# Fork-only: verifies the code compiles and produces a debug APK for testing.
# The release workflow needs signing secrets the fork does not have, so this is
# how the fork is built. Not part of the upstream pull request.
name: Debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Validate bundled scanner CIDRs
        working-directory: scanner
        run: go run ./cmd/normalize_scanner_cidrs --check ../assets/scanner

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Psiphon exit (built from source with the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_psiphon.sh

      - name: Tor and lyrebird (Tor Project's expert bundles, hash-checked)
        run: bash scripts/fetch_tor.sh

      - name: Xray core (built from xray/ with gomobile and the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_xray.sh

      - name: Free Go build cache before APK packaging
        run: |
          go clean -cache -modcache
          df -h /

      - name: Routing data (Chocolate4U/Iran-v2ray-rules, latest)
        run: bash scripts/fetch_geo.sh

      - name: Minify worker
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run minify

      - name: Tor bridges for the setup wizard (fresh each build)
        run: bash scripts/fetch_tor_bridges.sh

      - run: flutter pub get --enforce-lockfile

      - run: flutter test --no-pub

      - run: flutter build apk --debug --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: bpb-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
